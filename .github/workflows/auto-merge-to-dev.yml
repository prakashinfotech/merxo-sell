name: Auto Merge to Dev

on:
  push:
    branches:
      - 'feature/**'
      - 'bug-fix/**'
      - 'bugfix/**'

jobs:
  merge-to-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge into dev
        run: |
          SOURCE_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Merging $SOURCE_BRANCH into dev"

          git fetch origin dev
          git checkout dev
          git pull origin dev

          if git merge --no-ff "origin/$SOURCE_BRANCH" -m "Auto-merge $SOURCE_BRANCH into dev [skip ci]"; then
            git push origin dev
            echo "Successfully merged $SOURCE_BRANCH into dev"
          else
            echo "Merge conflict detected. Aborting."
            git merge --abort
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
