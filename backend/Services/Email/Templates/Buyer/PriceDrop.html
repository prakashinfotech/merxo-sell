<table width="100%" cellpadding="0" cellspacing="0" border="0" style="text-align: center;">
    <!-- Header -->
    <tr>
        <td style="padding-bottom: 32px;">
            <div style="font-size: 28px; font-weight: 900; color: #0f172a; letter-spacing: -1px; text-transform: uppercase;">PRICE DROP ALERT</div>
            <div style="font-size: 18px; color: #64748b; font-weight: 600; margin-top: 4px;">An Item You Liked Just Got Cheaper</div>
        </td>
    </tr>

    <!-- Dynamic Product Image -->
    {{ProductImageHtml}}

    <!-- Details Box -->
    <tr>
        <td align="center">
            <table width="360" cellpadding="0" cellspacing="0" border="0" style="background: #fff7ed; border-radius: 32px; border: 1.5px solid #fed7aa; text-align: center; position: relative; overflow: hidden;">
                <tr>
                    <td style="padding: 40px 24px;">
                        <div style="margin-bottom: 16px;">
                            <img src="{{ApiUrl}}/uploads/price_tag_premium.png" width="80" style="display: block; margin: 0 auto;">
                        </div>
                        <div style="font-size: 13px; font-weight: 800; color: #9a3412; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;">Price Reduction Details</div>
                        <div style="font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px; line-height: 1.4;">{{ProductName}}</div>
                        <div style="font-size: 15px; color: #94a3b8; font-weight: 600; text-decoration: line-through; margin-bottom: 4px;">Was: CA${{OldPrice}}</div>
                        <div style="font-size: 32px; font-weight: 900; color: #16a34a; margin-bottom: 8px;">NOW: CA${{NewPrice}}</div>
                        <div style="display: inline-block; padding: 6px 16px; background: #ff6000; color: #ffffff; border-radius: 100px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">{{Percent}}% EXCLUSIVE DISCOUNT!</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    <!-- Action -->
    <tr>
        <td align="center" style="padding-top: 48px;">
            <a href="{{AppUrl}}/shop" style="display: inline-block; padding: 22px 48px; background: #ff6000; color: #ffffff; font-weight: 900; border-radius: 20px; text-decoration: none; font-size: 17px; box-shadow: 0 12px 24px rgba(255, 96, 0, 0.3); text-transform: uppercase; letter-spacing: 1px;">Secure This Deal Now</a>
        </td>
    </tr>

    <!-- Footer Stats -->
    <tr>
        <td style="padding-top: 56px;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #f8fafc; border-radius: 24px; padding: 24px;">
                <tr>
                    <td width="33%" align="center">
                        <div style="font-size: 18px; font-weight: 800; color: #0f172a;">24h</div>
                        <div style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Offer Time</div>
                    </td>
                    <td width="33%" align="center" style="border-left: 1.5px solid #e2e8f0; border-right: 1.5px solid #e2e8f0;">
                        <div style="font-size: 18px; font-weight: 800; color: #0f172a;">Fast</div>
                        <div style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Shipping</div>
                    </td>
                    <td width="33%" align="center">
                        <div style="font-size: 18px; font-weight: 800; color: #0f172a;">Limit</div>
                        <div style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Low Stock</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
