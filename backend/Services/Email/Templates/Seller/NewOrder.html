<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" style="padding-bottom: 24px;">
            <div style="background: #dcfce7; display: inline-block; padding: 16px; border-radius: 20px; margin-bottom: 24px;">
                <img src="https://img.icons8.com/fluency/96/money-bag.png" width="48" height="48">
            </div>
            <h1 style="font-size: 28px; font-weight: 900; color: #0f172a; margin: 0; letter-spacing: -1px;">New Order Received! 💰</h1>
        </td>
    </tr>
    <tr>
        <td style="padding-bottom: 32px;">
            <p style="font-size: 16px; font-weight: 800; color: #0f172a; margin: 0 0 8px;">Hi {{SellerName}},</p>
            <p style="color: #64748b; font-size: 14px; line-height: 1.6; margin: 0;">
                You just received a new order #{{OrderId}}. Please fulfill it as soon as possible to maintain your seller rating.
            </p>
        </td>
    </tr>
    <tr>
        <td>
            <table width="100%" cellpadding="16" cellspacing="0" border="0" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 20px;">
                <tr>
                    <td>
                        <p style="font-size: 12px; font-weight: 900; color: #0f172a; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 8px;">Order Details</p>
                        <p style="font-size: 14px; color: #64748b; margin: 0;">Customer: {{BuyerName}}</p>
                        <p style="font-size: 14px; color: #64748b; margin: 0;">Total Payout: <strong style="color: #10b981;">{{Total}}</strong></p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td align="center" style="padding-top: 32px;">
            <a href="{{AppUrl}}/seller/orders/{{OrderId}}" class="btn">View Order Details</a>
        </td>
    </tr>
</table>
