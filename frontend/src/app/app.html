<app-header *ngIf="!isPortal() && !isAuth()"></app-header>
<app-cart-drawer *ngIf="!isPortal() && !isAuth()"></app-cart-drawer>
<main class="main-content" [class.is-portal]="isPortal()" [class.is-auth]="isAuth()">
  <router-outlet></router-outlet>
</main>
<app-footer *ngIf="!isPortal() && !isAuth()"></app-footer>

<!-- Floating toast notifications (success / error / info / warn) -->
<app-toast-host></app-toast-host>

<!-- Global loading overlay — shown via LoadingService.show() / hide() -->
<app-loading-overlay></app-loading-overlay>
